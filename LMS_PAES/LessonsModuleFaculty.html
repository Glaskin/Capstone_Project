<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Manage Lessons</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
            crossorigin="anonymous" />
        <link rel="stylesheet" href="css/Dashboard.css" />
    </head>
    <body>
        <nav class="navbar fixed-top navbar-light bg-warning">
            <div class="container-fluid">
                <a class="navbar-brand navbar-brand-logo" href="Dashboard.html">
                    <img src="Images/abeLogo.png" alt="PAES Logo" height="40" />
                    <span>PAES</span>
                </a>
                <button
                    class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarNav"
                    aria-controls="navbarNav"
                    aria-expanded="false"
                    aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a href="Dashboard.html" class="nav-link">Home</a>
                        </li>
                        <li class="nav-item">
                            <a href="Profile.html" class="nav-link">Profile</a>
                        </li>
                        <li class="nav-item">
                            <a href="LandingPage.html"
                                class="nav-link">Logout</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
        <!-- end of navigation -->

        <div class="container mt-5 pt-5">
            <h2 class="text-center mb-4">Manage Lessons</h2>
            <div class="card p-4">
                <div class="mb-3">
                    <label for="lesson-title" class="form-label">Lesson
                        Title</label>
                    <input type="text" class="form-control" id="lesson-title" />
                </div>
                <div class="mb-3">
                    <label for="lesson-content" class="form-label">Lesson
                        Content</label>
                    <textarea class="form-control" id="lesson-content"
                        rows="5"></textarea>
                </div>
                <button class="btn btn-primary" id="add-lesson-btn">Add
                    Lesson</button>
            </div>
            <div id="lessons-list" class="mt-4">
                <!-- Lessons will be dynamically added here -->
            </div>
        </div>

        <footer class="bg-warning text-center py-3 mt-5">
            <p>&copy; 2024 LMS. All rights reserved.</p>
        </footer>

        <script>
      document.addEventListener("DOMContentLoaded", function () {
        const lessonsList = document.getElementById("lessons-list");
        const addLessonBtn = document.getElementById("add-lesson-btn");
        const lessonTitleInput = document.getElementById("lesson-title");
        const lessonContentInput = document.getElementById("lesson-content");

        addLessonBtn.addEventListener("click", function () {
          const title = lessonTitleInput.value.trim();
          const content = lessonContentInput.value.trim();

          if (title && content) {
            addLesson(title, content);
            lessonTitleInput.value = "";
            lessonContentInput.value = "";
          } else {
            alert("Please enter both title and content for the lesson.");
          }
        });

        function addLesson(title, content) {
          const lessonCard = document.createElement("div");
          lessonCard.className = "card mt-3";
          lessonCard.innerHTML = `
            <div class="card-body">
              <h5 class="card-title">${title}</h5>
              <p class="card-text">${content}</p>
              <button class="btn btn-secondary edit-lesson-btn">Edit</button>
              <button class="btn btn-danger remove-lesson-btn">Remove</button>
            </div>
          `;

          lessonsList.appendChild(lessonCard);

          const editBtn = lessonCard.querySelector(".edit-lesson-btn");
          const removeBtn = lessonCard.querySelector(".remove-lesson-btn");

          editBtn.addEventListener("click", function () {
            const newTitle = prompt("Edit lesson title:", title);
            const newContent = prompt("Edit lesson content:", content);
            if (newTitle && newContent) {
              lessonCard.querySelector(".card-title").textContent = newTitle;
              lessonCard.querySelector(".card-text").textContent = newContent;
            }
          });

          removeBtn.addEventListener("click", function () {
            lessonsList.removeChild(lessonCard);
          });
        }
      });
    </script>
    </body>
</html>
