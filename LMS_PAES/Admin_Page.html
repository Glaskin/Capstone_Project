<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Dark Scheme</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom Dark Mode Styles -->
    <link rel="stylesheet" href="css/admin-page.css">
</head>
<body class="bg-dark text-light">
    <div class="container mt-5">
        <h1>Admin Dashboard</h1>

        <!-- Navigation Tabs -->
        <ul class="nav nav-tabs" id="dashboardTabs">
            <li class="nav-item">
                <a class="nav-link active text-light bg-secondary" id="users-tab" data-bs-toggle="tab" href="#users-section">Manage Users</a>
            </li>
            <li class="nav-item">
                <a class="nav-link text-light bg-secondary" id="courses-tab" data-bs-toggle="tab" href="#courses-section">Manage Courses</a>
            </li>
            <li class="nav-item">
                <a class="nav-link text-light bg-secondary" id="announcement-tab" data-bs-toggle="tab" href="#announcements-section">Announcement</a>
            </li>
            <li class="nav-item">
                <a class="nav-link text-light bg-secondary" id="auditlog-tab" data-bs-toggle="tab" href="#auditlog-section">Audit Log</a>
            </li>
        </ul>

        <!-- Tab Content -->
        <div class="tab-content mt-4">
            <!-- Users Section -->
            <div class="tab-pane fade show active" id="users-section">
                <h2>Manage Users</h2>
                <button class="btn btn-success mb-3" onclick="addUser()">Add User</button>
                <table class="table table-bordered table-dark table-striped">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Username</th>
                            <th>Email</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="users-table">
                        <!-- Users will be dynamically added here -->
                    </tbody>
                </table>
            </div>

            <!-- Courses Section -->
            <div class="tab-pane fade" id="courses-section">
                <h2>Manage Courses</h2>
                <button class="btn btn-success mb-3" onclick="addCourse()">Add Course</button>
                <table class="table table-bordered table-dark table-striped">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Course Name</th>
                            <th>Description</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="courses-table">
                        <!-- Courses will be dynamically added here -->
                    </tbody>
                </table>
            </div>

            <!-- Announcements Section -->
            <div class="tab-pane fade" id="announcements-section">
                <h2>Manage Announcements</h2>
                <div class="mb-3">
                    <input type="text" id="announcementTitle" class="form-control" placeholder="Announcement Title">
                    <textarea id="announcementContent" class="form-control mt-2" rows="3" placeholder="Announcement Content"></textarea>
                    <button class="btn btn-success mt-2" onclick="addAnnouncement()">Post Announcement</button >
                </div>
                <table class="table table-bordered table-dark table-striped">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Title</th>
                            <th>Content</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="announcements-table">
                        <!-- Announcements will be dynamically added here -->
                    </tbody>
                </table>
            </div>

            <!-- Audit Log Section -->
            <div class="tab-pane fade" id="auditlog-section">
                <h2>Audit Log</h2>
                <div class="mb-3">
                    <label for="dateFilter" class="form-label">Filter by Date:</label>
                    <input type="date" id="dateFilter" class="form-control">
                    <button class="btn btn-primary mt-2" onclick="filterAuditLog()">Filter</button>
                </div>
                <table class="table table-bordered table-dark table-striped">
                    <thead>
                        <tr>
                            <th>Timestamp</th>
                            <th>User</th>
                            <th>Action</th>
                            <th>Details</th>
                        </tr>
                    </thead>
                    <tbody id="auditlog-table">
                        <!-- Audit log entries will be dynamically added here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    

    <!-- Bootstrap JS and Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom Script -->
    <script src="js/admin-page.js"></script>
</body>
</html>
