<div class="Qmodule">
    <h2>Simple Quiz</h2>
    
    <!-- Question 1 -->
    <div class="question" id="question1">
        <p>1. What is the capital of France?</p>
        <div class="answers">
            <label><input type="radio" name="q1" value="Paris"> Paris</label>
            <label><input type="radio" name="q1" value="London"> London</label>
            <label><input type="radio" name="q1" value="Berlin"> Berlin</label>
            <label><input type="radio" name="q1" value="Madrid"> Madrid</label>
        </div>
        <button class="button" onclick="showQuestion('question2')">Next</button>
    </div>

    <!-- Question 2 -->
    <div class="question" id="question2" style="display: none;">
        <p>2. Which is the largest planet in our solar system?</p>
        <div class="answers">
            <label><input type="radio" name="q2" value="Jupiter"> Jupiter</label>
            <label><input type="radio" name="q2" value="Mars"> Mars</label>
            <label><input type="radio" name="q2" value="Earth"> Earth</label>
            <label><input type="radio" name="q2" value="Venus"> Venus</label>
        </div>
        <button class="button" onclick="showQuestion('question1')">Previous</button>
        <button class="button" onclick="showQuestion('question3')">Next</button>
    </div>

    <!-- Question 3 -->
    <div class="question" id="question3" style="display: none;">
        <p>3. What is the boiling point of water?</p>
        <div class="answers">
            <label><input type="radio" name="q3" value="100°C"> 100°C</label>
            <label><input type="radio" name="q3" value="50°C"> 50°C</label>
            <label><input type="radio" name="q3" value="0°C"> 0°C</label>
            <label><input type="radio" name="q3" value="200°C"> 200°C</label>
        </div>
        <button class="button" onclick="showQuestion('question2')">Previous</button>
        <input type="submit" class="button" value="Submit Quiz">
    </div>

</div>

<script>
    function showQuestion(questionId) {
        // Hide all questions
        var questions = document.getElementsByClassName('question');
        for (var i = 0; i < questions.length; i++) {
            questions[i].style.display = 'none';
        }
        // Show the current question
        document.getElementById(questionId).style.display = 'block';
    }

</script>
