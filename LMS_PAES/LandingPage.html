<!doctype html>
<html lang="en">
  <head>
    <title>Student Registration</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous" />
    <link rel="stylesheet" href="bootstrap-offline/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="css/registration.css" />
  </head>
  
  <body>
    <div class="container-fluid">
      <form class="mx-auto" id="registrationForm">
        <h4 class="text-center">Student Registration</h4>
        <div class="mb-3 mt-5">
          <label for="studentName" class="form-label">Name</label>
          <input type="text" class="form-control" id="studentName" required />
        </div>
        <div class="mb-3">
          <label for="studentEmail" class="form-label">Email</label>
          <input type="email" class="form-control" id="studentEmail" required />
        </div>
        <div class="mb-3">
          <label for="studentPassword" class="form-label">Password</label>
          <input type="password" class="form-control" id="studentPassword" required />
        </div>
        <div class="mb-3">
          <label for="confirmPassword" class="form-label">Confirm Password</label>
          <input type="password" class="form-control" id="confirmPassword" required />
        </div>
        <button type="submit" class="btn btn-primary mt-4">Register</button>
      </form>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"></script>
    <script 
      src="bootstrap-offline/js/bootstrap.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"></script>
    <script src="js/student_registration.js"></script>
  </body>
</html>
