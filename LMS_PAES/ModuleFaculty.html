<!doctype html>
<html lang="en">
    <head>
        <title>Course Modules - Faculty View</title>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="css/course.css">
        <link rel="stylesheet" href="css/Module.css"/>
    </head>

    <body>
        <!-- Navigation Bar -->
        <nav class="navbar fixed-top navbar-expand-sm navbar-light bg-warning">
            <div class="container-fluid">
                <a class="navbar-brand navbar-brand-logo" href="Dashboard.html">
                    <img src="Images/abeLogo.png" alt="PAES Logo" height="40">
                    <span>PAES</span>
                </a>
                <!-- Add other navbar items as needed -->
            </div>
        </nav>

        <div class="content mt-5 pt-3">
            <div class="container my-5">
                <h2 class="text-center mb-4">Course Modules - Faculty Management</h2>
                
                <!-- Add New Module Form -->
                <div class="card mb-4">
                    <div class="card-header">
                        <h5>Add New Module</h5>
                    </div>
                    <div class="card-body">
                        <form id="addModuleForm">
                            <div class="mb-3">
                                <label for="moduleName" class="form-label">Module Name</label>
                                <input type="text" class="form-control" id="moduleName" required>
                            </div>
                            <button type="submit" class="btn btn-primary">Add Module</button>
                        </form>
                    </div>
                </div>

                <!-- Existing Modules -->
                <div class="accordion" id="moduleAccordion">
                    <!-- Module 1 -->
                    <div class="accordion-item">
                        <h2 class="accordion-header" id="headingOne">
                            <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#collapseOne" aria-expanded="true" aria-controls="collapseOne">
                                Module 1: Introduction
                            </button>
                        </h2>
                        <div id="collapseOne" class="accordion-collapse collapse show" aria-labelledby="headingOne" data-bs-parent="#moduleAccordion">
                            <div class="accordion-body">
                                <ul id="lessonList1">
                                    <li>Lesson 1: Course Overview</li>
                                    <li>Lesson 2: Basic Concepts</li>
                                    <li>Quiz: Introduction</li>
                                </ul>
                                <!-- Add Lesson Form -->
                                <form class="mt-3 add-lesson-form">
                                    <div class="input-group mb-3">
                                        <input type="text" class="form-control" placeholder="New Lesson Name" required>
                                        <button class="btn btn-outline-secondary" type="submit">Add Lesson</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>

                    <!-- Additional modules can be added dynamically -->
                </div>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script>
            // JavaScript to handle form submissions and dynamic content addition
            document.addEventListener('DOMContentLoaded', function() {
                // Add new module
                document.getElementById('addModuleForm').addEventListener('submit', function(e) {
                    e.preventDefault(); // Prevent default form submission
                    // Add new module logic here
                });

                // Add new lesson
                document.querySelectorAll('.add-lesson-form').forEach(function(form) {
                    form.addEventListener('submit', function(e) {
                        e.preventDefault(); // Prevent default form submission
                        // Add new lesson logic here
                    });
                });
            });
        </script>
    </body>
</html>
