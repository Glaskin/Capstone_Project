<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Faculty Dashboard</title>

    <link rel="stylesheet" href="bootstrap-offline/css/bootstrap.min.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous" />
    <link rel="stylesheet" href="css/Dashboard.css" />
    <link rel="stylesheet" href="css/Style.css">
  </head>

  <body>
    <!-- Navigation Bar -->
    <nav class="navbar fixed-top navbar-expand-sm navbar-light bg-warning">
      <div class="container-fluid">
        <a class="navbar-brand navbar-brand-logo" href="FacultyDashboard.html">
          <img src="Images/abeLogo.png" alt="PAES Logo" height="40">
          <span>PAES - Faculty</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
          data-bs-target="#navbarNav" aria-controls="navbarNav"
          aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a href="FacultyDashboard.html" class="nav-link active">Home</a>
            </li>
            <li class="nav-item">
              <a href="Profile.html" class="nav-link">Profile</a>
            </li>
            <li class="nav-item">
              <a href="LandingPage.html" class="nav-link">Logout</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
    <!-- end of navigation -->

    <div class="content" style="margin-top: 100px;">
      <!-- Welcome Section -->
      <div id="Welcome" class="text-center py-5">
        <h1>Welcome, <span id="userName">Faculty Member</span>!</h1>
        <p>Manage your courses and track your students' progress here.</p>
      </div>

      <!-- Create Announcement Section -->
      <div class="container my-5">
        <h2 class="text-center mb-4">Create Announcement</h2>
        <div class="card">
          <div class="card-body">
            <form id="announcementForm">
              <div class="mb-3">
                <label for="announcementTitle" class="form-label">Title</label>
                <input type="text" class="form-control" id="announcementTitle"
                  required>
              </div>
              <div class="mb-3">
                <label for="announcementDate" class="form-label">Date</label>
                <input type="date" class="form-control" id="announcementDate"
                  required>
              </div>
              <div class="mb-3">
                <label for="announcementType" class="form-label">Type</label>
                <select class="form-select" id="announcementType" required>
                  <option value="info">Info</option>
                  <option value="success">Success</option>
                  <option value="warning">Warning</option>
                  <option value="danger">Danger</option>
                </select>
              </div>
              <button type="submit" class="btn btn-primary">Create
                Announcement</button>
            </form>
          </div>
        </div>
      </div>

      <!-- Courses Management Section -->
      <div class="container my-5">
        <h2 class="text-center mb-4">Courses Management</h2>
        <div id="coursesList" class="row">
          <!-- Courses will be added here -->
        </div>
      </div>

      <!-- Students Progress Section -->
      <div class="container my-5">
        <h2 class="text-center mb-4">Students Progress</h2>
        <div id="studentsProgress" class="row">
          <!-- Student progress will be added here -->
        </div>
      </div>

      <!-- Footer -->
      <footer class="bg-warning text-center py-3 mt-5">
        <p>&copy; 2024 LMS. All rights reserved.</p>
      </footer>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"></script>
    <script src="js/dashboardFaculty.js"></script>
  </body>
</html>
